# Example workflow: measure the AION experiments of a pull request and post the result.
#
# Copy this file into `.github/workflows/` of the repository you want to measure. AION itself is
# checked out next to the project under test; the action builds the CLI from source unless you
# provide a prebuilt binary via `aion-binary`.
name: AION experiments

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # needed to post or update the result comment

concurrency:
  group: aion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  aion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The project under test. Full history, so AION can resolve the base commit and diff it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # AION itself, next to the project.
      - uses: actions/checkout@v4
        with:
          repository: aion/aion          # <- point this at your AION checkout
          path: .aion-toolchain
          fetch-depth: 1

      - name: Run AION
        uses: ./.aion-toolchain/.github/actions/aion
        with:
          aion-path: .aion-toolchain
          experiments: all               # or "bloom-startup-test service-startup-test"
          base-ref: ${{ github.event.pull_request.base.sha }}
          candidate-ref: ${{ github.event.pull_request.head.sha }}
          iterations: '5'
          warmup: '1'
          fail-on-regression: 'false'    # set to 'true' to fail the job on a regression
          comment: 'true'
